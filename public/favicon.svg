<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!--
    Swaggr — six runes around an empty core, the way the game's inventory lays
    them out. One stone, drawn once and rotated six times.

    The stone is a pentagon with two corners on a central hexagon and a point
    facing out. Two constraints hold the six in agreement:

      · The inner edge is one side of a regular hexagon, so a half-width of 5
        sits at apothem 5√3 = 8.66.
      · The shoulders sit 30° either side of the stone's own axis — the only
        angle a ±60° neighbour lands on. Their radius decides the silhouette:
        at 27 the six tile a plain hexagon, at 20 they cut the notch that makes
        the six-pointed star.

    Each stone is then scaled to 0.88 about its own centroid (0, −17.62) rather
    than about the origin, so the gap between neighbours is even on every side
    instead of wedging toward the middle.

    The ground is left transparent so the star sits on the browser's own tab
    bar rather than on a plate of a colour the chrome around it does not use.
    That costs the contrast the dark plate used to guarantee, so the gold
    follows the viewer's theme instead: the app's own accent on a dark bar,
    where it clears 5.8:1, and a deeper gold on a light one, where the app's
    accent would fall to 1.6:1 and read as a pale smudge. No strokes — a
    stroke thin enough to look right at 512px closes up entirely at 16.
  -->
  <style>
    /* Bare :root is the light case, so a browser that does not resolve the
       media query still gets the gold that survives a light tab bar. */
    :root { --ink: #a87f26; }
    @media (prefers-color-scheme: dark) { :root { --ink: #d9ad52; } }
  </style>
  <g transform="translate(32 32) scale(1.06)" fill="var(--ink, #a87f26)">
    <path id="s" d="M-4.4 -9.74 4.4 -9.74 8.8 -17.36 0 -28.95 -8.8 -17.36z"/>
    <use href="#s" transform="rotate(60)"/>
    <use href="#s" transform="rotate(120)"/>
    <use href="#s" transform="rotate(180)"/>
    <use href="#s" transform="rotate(240)"/>
    <use href="#s" transform="rotate(300)"/>
  </g>
</svg>
