[package]
name = "jaswa-helper"
version = "1.0.27"
edition = "2024"
description = "Local Steam companion for JASWA"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
aes = "0.8.4"
base64 = "0.22.1"
cbc = "0.1.2"
cipher = "0.4.4"
flate2 = "1.1.0"
rcgen = "0.13.2"
rustls = "0.23.27"
rustls-pemfile = "2.2.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tauri = { version = "2.11.5", features = ["tray-icon"] }
time = { version = "0.3.41", features = ["formatting"] }
uuid = { version = "1.16.0", features = ["v4"] }
webpki-roots = "0.26.11"
windows-sys = { version = "0.60.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_Security_Cryptography",
  "Win32_System_Com",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3.19.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
