[package]
name = "jaswa-helper"
version = "1.0.66"
edition = "2024"
description = "Local Steam companion for JASWA"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
aes = "0.9.4"
base64 = "0.23.1"
cbc = "0.2.1"
cipher = "0.5.2"
flate2 = "1.1.11"
rcgen = "0.14.10"
rustls = "0.23.46"
rustls-pemfile = "2.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = ["tray-icon"] }
time = { version = "0.3.55", features = ["formatting"] }
uuid = { version = "1.29.2", features = ["v4"] }
webpki-roots = "1.0.12"
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_Security_Cryptography",
  "Win32_System_Com",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
