name: Deploy JASWA

# Slået fra indtil Cloudflare Pages/Workers er sat op og hemmelighederne
# CLOUDFLARE_API_TOKEN og CLOUDFLARE_ACCOUNT_ID findes i repoet.
# Kør den manuelt fra Actions-fanen for at teste, og sæt push-udløseren
# nedenfor tilbage, når deployet virker.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test
      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
